<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Short Link Not Found</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-decor"></div>
  <main class="container" style="max-width: 600px; text-align: center; padding-top: 5rem;">
    <div class="card" style="padding: 3rem 2rem;">
      <div style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
      <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 700;">Short Link Not Found</h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem; line-height: 1.6;">
        The shortened URL you tried to visit doesn't exist in our records or may have been deleted.
      </p>
      
      <div style="background: rgba(255, 255, 255, 0.05); padding: 1rem; border-radius: 8px; margin-bottom: 2rem; font-family: monospace; font-size: 0.9rem; color: var(--accent);">
        Status: 404 Not Found &bull; Handled by Express Dynamic Routing
      </div>

      <a href="/" class="btn btn-primary" style="display: inline-flex; text-decoration: none;">
        <span>Create a New Short Link</span>
        <span>→</span>
      </a>
    </div>
  </main>
</body>
</html>
